# Builds the standalone executables and publishes a GitHub release when a
# version tag (v1.2.3) is pushed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      # Pure Go: both targets cross-compile from Linux. The web pages are
      # embedded in the binary; the certificate is generated on first run.
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          flags="-s -w -X main.version=${GITHUB_REF_NAME}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$flags" \
            -o "dist/remotephotoserver-${GITHUB_REF_NAME}-windows-amd64.exe" .
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$flags" \
            -o "dist/remotephotoserver-${GITHUB_REF_NAME}-linux-amd64" .
          cd dist && sha256sum * > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
