# Runs the checks and tests on every commit pushed to a branch and on pull
# requests. Executables are only built by release.yml, on version tags.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      - name: Test
        run: go test ./...
